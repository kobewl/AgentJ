spring:
  application:
    name: AgentJ_backend
  profiles:
    active: dev
  ai:
    dashscope:
      # API key 配置在 application-dev.yml 中
      chat:
        options:
          model: qwen-flash
    memory:
      mysql:
        enabled: true
  # Redis 配置（本地开发环境）
  # Redis 连接配置已移至 application-dev.yml
  # 如需使用 Redis 功能（工作流检查点、长期内存Store），请配置 application-dev.yml：
  #
  # spring:
  #   data:
  #     redis:
  #       host: localhost
  #       port: 6379
  #       database: 0
  #       lettuce:
  #         pool:
  #           max-active: 8
  #           max-idle: 8
  #           min-idle: 0

server:
  port: 8080

# springdoc-openapi 接口文档配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.wangliang.agentj.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn

agent:
  init: true

namespace:
  value: default

# 禁用自动打开浏览器
lynxe:
  general:
    openBrowser: false

# 工作流引擎配置
agentj:
  workflow:
    # 检查点器类型: memory（默认）, redis, postgresql
    checkpoint:
      type: redis
    # 长期内存Store类型: memory（默认）, redis, postgresql
    store:
      type: redis
      ttl: 86400  # Store数据过期时间（秒），默认24小时
    # 编译图缓存配置
    cache:
      maxSize: 100              # 最大缓存数量
      expireAfterWriteMinutes: 30  # 写入后过期时间（分钟）
